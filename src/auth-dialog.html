<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Signing in&#8230;</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
  <script src="config.js?v=20260924125617"></script>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; color: #242424; margin: 24px; }
    .err { color: #c4314b; white-space: pre-wrap; }
  </style>
</head>
<body>
  <p id="msg">Redirecting you to sign in&#8230;</p>
  <script>
    // Entry point for the Office Dialog API. Task panes cannot reliably open a
    // browser popup - Outlook blocks it - so the sign-in runs inside an
    // Office-managed dialog instead, which cannot be blocked.
    //
    // This page only kicks off the redirect. Entra sends the response to
    // auth-end.html, which hands the token back to the task pane.
    (function () {
      // MSAL leaves an interaction.status lock behind if a flow is abandoned,
      // and every later sign-in then fails with interaction_in_progress. There
      // is no API to clear it, so remove it directly.
      function clearLocks() {
        [localStorage, sessionStorage].forEach(function (store) {
          try {
            var doomed = [];
            for (var i = 0; i < store.length; i++) {
              var k = store.key(i);
              if (k && k.indexOf('interaction.status') !== -1) { doomed.push(k); }
            }
            doomed.forEach(function (k) { try { store.removeItem(k); } catch (e) { } });
          } catch (e) { }
        });
      }

      function fail(e) {
        clearLocks();
        var m = document.getElementById('msg');
        m.className = 'err';
        m.textContent = 'Sign-in could not start: ' + (e && e.message ? e.message : String(e));
        try {
          if (Office && Office.context && Office.context.ui) {
            Office.context.ui.messageParent(JSON.stringify({
              ok: false, error: (e && e.message) ? e.message : String(e) }));
          }
        } catch (e2) { /* not in a dialog */ }
      }

      // A lock from a previous abandoned attempt would fail this one before it
      // even starts.
      clearLocks();

      try {
        var pca = new msal.PublicClientApplication({
          auth: {
            clientId: OooConfig.clientId,
            authority: 'https://login.microsoftonline.com/' + (OooConfig.tenantId || 'common'),
            redirectUri: OooConfig.redirectUri,
            // MUST be false. The default (true) makes MSAL navigate back to the
            // page that started the redirect once the response is handled. That
            // page is this one, which immediately starts another redirect -
            // an infinite sign-in loop that never completes.
            navigateToLoginRequestUrl: false
          },
          cache: { cacheLocation: 'localStorage' }
        });
        var ready = pca.initialize ? pca.initialize() : Promise.resolve();
        ready
          .then(function () {
            return pca.acquireTokenRedirect({
              scopes: OooConfig.scopes,
              redirectUri: OooConfig.redirectUri,
              prompt: 'select_account'
            });
          })
          .catch(fail);
      } catch (e) { fail(e); }
    }());
  </script>
</body>
</html>
